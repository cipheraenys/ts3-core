name: ci
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Debian trixie ships mbedTLS 3.6; ubuntu-24.04's libmbedtls-dev is 2.28, which is too old.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: apt-get update && apt-get install -y --no-install-recommends g++ gcc make cmake libmbedtls-dev libopus-dev
      - name: build.sh + selftest
        run: sh build.sh && ./out/selftest && ./out/port_conformance
      - name: CMake build + ctest
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
